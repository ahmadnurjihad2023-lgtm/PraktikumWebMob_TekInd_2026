<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Listrik</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .card-custom {
            max-width: 400px;
            margin: 80px auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="card card-custom shadow-sm">
        <div class="card-body">

            <h4 class="text-center mb-3">Kalkulator Biaya Listrik</h4>
            <hr>

            <div class="mb-3">
                <label class="form-label">Daya (Watt)</label>
                <input type="number" id="daya" class="form-control" placeholder="Contoh: 900">
            </div>

            <div class="mb-3">
                <label class="form-label">Jam Pemakaian</label>
                <input type="number" id="jam" class="form-control" placeholder="Contoh: 5 jam">
            </div>

            <div class="mt-3 p-2 bg-light rounded text-center">
                <h5 id="hasil" class="mb-0">Total kWh: 0 | Biaya: Rp 0</h5>
            </div>

        </div>
    </div>

    <script src="projekmini.js"></script>

</body>

</html>
