<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <div class="row">
        <!-- Kolom kiri: form input-->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Input Data</div>
                <div class="card-body">
                    <form id="formProduksi">
                        <div class="mb-3">
                            <label>Tanggal</label>
                            <input type="date" id="tanggal" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Nama Operator</label>
                            <select id="operator" class="form-select" required>
                                <option value="">Pilih Operator</option>
                                <option value="Ahmad Nurjihad">Ahmad Nurjihad</option>
                                <option value="Michel AK">Michel AK</option>
                                <option value="Anggar">Anggar</option>
                                <option value="Julang">Julang</option>
                                <option value="Farra">Farra</option>
                                <option value="Cahya">Cahya</option>
                                <option value="Ilham">Ilham</option>
                                <option value="Budi">Budi</option>
                                <option value="Dewi">Dewi</option>
                                <option value="Habib">Habib</option>
                                <option value="Tri">Tri</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Shift</label>
                            <select id="shift" class="form-select" required>
                                <option value="">Pilih Shift</option>
                                <option value="pagi">pagi</option>
                                <option value="siang">siang</option>
                                <option value="malam">malam</option>
                            </select>
                            <div class="mb-3">
                                <label>Jumlah Produksi (unit)</label>
                                <input type="number" id="jumlah" class="form-control" min="1" placeholder="--Masukan Jumlah Produksi--" required>
                            </div>



                            <button type="submit" class="btn btn-primary w-100">Simpan Log</button>
                            <button type="button" id="btnHapusSemua" class="btn btn-danger w-100 mt-2">Hapus Semua
                                Data</button>

                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Kolom kanan: tabel data -->
        <div class="col-md-8">
            <h3>Riwayat Produksi</h3>
            <button id="btnSortJumlah" class="btn btn-success mb-3">
                Sortir berdasarkan Jumlah (Terbesar)
            </button>
            <div class="mb-3">
                <input type="text" id="cariOperator" class="form-control" placeholder="Cari Nama Operator...">
            </div>
            <table class="table table-boardered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Tanggal</th>
                        <th>Operator</th>
                        <th>Shift</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabelBody">
                    <!-- Data akan masuk di sini lewat JS-->
                </tbody>
            </table>
        </div>
    </div>

    <script src="tugasproyekmini.js"></script>
</body>

</html>
